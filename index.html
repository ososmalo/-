<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام التطوير – مجلس الريودان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&family=Press+Start+2P&display=swap">
<style>
:root{color-scheme:dark;--bg:#14122b;--bg2:#1c1940;--pn:#241f52;--ln:#0a0919;--tx:#f3f0ff;--mu:#a49fd0;--gd:#ffd23f;--mn:#3ddc97;--pk:#ff4f8b;--bl:#4cc9f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:600 16px/1.7 Cairo,Tahoma,sans-serif;
background-image:linear-gradient(var(--bg2) 2px,transparent 2px),linear-gradient(90deg,var(--bg2) 2px,transparent 2px);background-size:32px 32px}
.px{font-family:'Press Start 2P',monospace;letter-spacing:0}
.wrap{max-width:980px;margin:0 auto;padding:16px}
.box{background:var(--pn);border:4px solid var(--ln);box-shadow:inset 0 0 0 3px #3b3485,6px 6px 0 var(--ln);padding:16px;margin-bottom:18px}
h1,h2,h3{font-weight:900;margin:0 0 10px}
h1{font-size:30px;color:var(--gd);text-shadow:3px 3px 0 var(--ln)}
h2{font-size:21px;color:var(--bl)}
h3{font-size:17px}
button,input,select,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--ln);border:3px solid #3b3485;padding:8px 10px;margin:4px 0 10px;border-radius:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
.btn{background:var(--gd);color:#241f00;border:4px solid var(--ln);box-shadow:0 5px 0 #b08d00,0 5px 0 4px var(--ln);padding:6px 16px;cursor:pointer;font-weight:900;margin:4px 0 9px 6px;border-radius:0}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b08d00,0 1px 0 4px var(--ln)}
.btn.g{background:var(--mn);box-shadow:0 5px 0 #1d8f60,0 5px 0 4px var(--ln)}
.btn.r{background:var(--pk);box-shadow:0 5px 0 #a8284f,0 5px 0 4px var(--ln);color:#fff}
.btn.s{background:var(--bl);box-shadow:0 5px 0 #2a8aa8,0 5px 0 4px var(--ln);color:#04202b}
.btn[disabled]{filter:grayscale(1);opacity:.6;cursor:not-allowed}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
nav .btn{margin:0 0 8px}
nav .on{background:var(--bl)}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.q{background:var(--bg);border:4px solid var(--ln);padding:12px;box-shadow:4px 4px 0 var(--ln)}
.tag{display:inline-block;border:3px solid var(--ln);padding:0 8px;font-size:13px;background:var(--pk);color:#fff;margin-left:6px}
.tag.w{background:var(--mn);color:#04281a}.tag.s{background:#7a4cff}.tag.p{background:var(--gd);color:#241f00}
.bar{height:26px;background:var(--ln);border:4px solid var(--ln);box-shadow:0 0 0 3px #3b3485;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--mn) 0 12px,#2bb97a 12px 16px);transition:width .5s steps(10)}
.mu{color:var(--mu);font-size:14px}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.av{width:120px;height:120px;background:var(--ln);border:4px solid #3b3485;image-rendering:pixelated}
.stat{font-size:11px;color:var(--gd);line-height:2.2}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:3px solid var(--ln);text-align:right}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gd);color:#241f00;border:4px solid var(--ln);padding:8px 18px;font-weight:900;z-index:9}
.tw{overflow-x:auto}
.ph{display:flex;gap:10px;flex-wrap:wrap}.ph>div{flex:1 1 220px}
.blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.blink{animation:none}.bar i{transition:none}}
body{background-color:#1b1147;background-image:linear-gradient(rgba(255,255,255,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.06) 2px,transparent 2px),linear-gradient(180deg,#2d1470,#17286a 55%,#0d4057);background-size:32px 32px,32px 32px,100% 100%;background-attachment:fixed;animation:gs 14s linear infinite}
@keyframes gs{to{background-position:32px 32px,32px 32px,0 0}}
body::before{content:'';position:fixed;top:0;left:0;width:4px;height:4px;background:#fff;pointer-events:none;box-shadow:12vw 8vh #fff,30vw 22vh #ffd23f,55vw 12vh #4cc9f0,78vw 30vh #fff,90vw 10vh #ff4f8b,8vw 60vh #3ddc97,40vw 75vh #fff,66vw 62vh #ffd23f,85vw 85vh #4cc9f0,20vw 90vh #ff4f8b;animation:tw 2s steps(2) infinite}
@keyframes tw{50%{opacity:.25}}
.wrap{position:relative;z-index:1}
h1{animation:hc 4s steps(1) infinite}@keyframes hc{0%{color:#ffd23f}25%{color:#ff9f1c}50%{color:#ff4f8b}75%{color:#4cc9f0}}
.box{border-top-color:var(--pk);transition:transform .12s steps(3)}.box:hover,.q:hover{transform:translate(-2px,-2px)}
.q{transition:transform .12s steps(3)}.q:nth-child(3n+1){border-color:#5b2cc0}.q:nth-child(3n+2){border-color:#0f6b7a}.q:nth-child(3n){border-color:#8a1f4d}
nav .btn:nth-child(5n+2){background:var(--mn);box-shadow:0 5px 0 #1d8f60,0 5px 0 4px var(--ln)}
nav .btn:nth-child(5n+3){background:var(--pk);color:#fff;box-shadow:0 5px 0 #a8284f,0 5px 0 4px var(--ln)}
nav .btn:nth-child(5n+4){background:#a77bff;box-shadow:0 5px 0 #6b3fd0,0 5px 0 4px var(--ln)}
nav .btn:nth-child(5n){background:#ff9f1c;box-shadow:0 5px 0 #b86d00,0 5px 0 4px var(--ln)}
nav .on{background:#fff!important;color:#241f00!important}
.bar i{background:repeating-linear-gradient(90deg,#3ddc97 0 12px,#ffd23f 12px 16px)}
.av{border-color:var(--rc,#3b3485);box-shadow:0 0 8px var(--rc,transparent);animation:gl 2s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 22px var(--rc,transparent)}}
.bob{animation:bob .9s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(.4px)}}
.ey{transform-box:fill-box;transform-origin:center;animation:bl 3.2s steps(1) infinite}@keyframes bl{0%{transform:scaleY(1)}92%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
.lgA{animation:sa .6s steps(1) infinite}.lgB{animation:sb .6s steps(1) infinite}
@keyframes sa{0%{transform:translateY(0)}50%{transform:translateY(-.5px)}}@keyframes sb{0%{transform:translateY(-.5px)}50%{transform:translateY(0)}}
.spk{animation:tw 1.2s steps(2) infinite}
.fr{visibility:hidden;animation:fr 1.2s steps(1) infinite}@keyframes fr{0%{visibility:visible}25%{visibility:hidden}}
.hero .av{width:140px;height:140px}
@media(prefers-reduced-motion:reduce){.fr{animation:none}.fr:first-child{visibility:visible}}
@media(prefers-reduced-motion:reduce){body,body::before,h1,.av,.bob,.ey,.lgA,.lgB,.spk{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const MAX=100,need=L=>100+L*25;
const TITLES=['متدرّب الظلال','حارس البوابة','صائد الوحوش','فارس الفجر','قاهر الزنازين','سيّاف النخبة','سيّد الظلال','أسطورة المملكة','ملك الفيالق','إمبراطور الريودان'];
const RC=['#9aa0a6','#8bc34a','#4cc9f0','#3d8bff','#b36bff','#ff4f8b','#ff9f1c','#ffd23f','#ff5252','#fff3b0'];
const FR=[['w..hhhh...','w.hhhhhh..','w.hseesh..','w..ssss...','w.bbbbbbcc','wsbbggbbcc','..bbbbbbc.','..bbbbbb..','..ll..ll..','..ll..ll..'],
['...hhhh...','..hhhhhh..','..hseesh..','...ssss...','..bbbbbbc.','wsbbggbbcc','w.bbbbbbc.','w.bbbbbb..','...ll.ll..','..ll...ll.'],
['...hhhh...','..hhhhhh.c','..hseesh.c','...ssss..c','..bbbbbbcc','wwsbbggbbc','..bbbbbb..','..bbbbbb..','..ll..ll..','..ll..ll..'],
['...hhhh...','..hhhhhh..','..hseesh..','...ssss...','..bbbbbbc.','wsbbggbbcc','w.bbbbbbc.','w.bbbbbb..','..ll.ll...','.ll...ll..']].map(f=>f.map(r=>r.slice(0,10)));
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const H=s=>{let h=5381;for(const c of s)h=(h*33+c.charCodeAt(0))>>>0;return h.toString(36)};
const wk=()=>{const d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+'-'+Math.floor(((d-j)/864e5+j.getDay())/7)};
const tIdx=L=>Math.min(9,Math.floor((L-1)/10));
function lv(xp){let L=1;while(L<MAX&&xp>=need(L)){xp-=need(L);L++}return{L,cur:L>=MAX?need(L):xp,need:need(L)}}
function sprite(L,z){const i=tIdx(L),c=RC[i],m={h:c,b:c+'cc',s:'#f2c9a0',e:'#14122b',g:'#ffd23f',l:'#3a3566',w:'#e8f4ff',c:c+'77'};let r='',sp='';
FR.forEach((fr,n)=>{r+=`<g class="fr" style="animation-delay:${n*.3}s">`;fr.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!='.')r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${m[ch]}"/>`}));r+='</g>'});
[[9,0],[9,9],[0,9],[5,0]].forEach(([x,y],j)=>sp+=`<rect class="spk" style="animation-delay:${j*.4}s" x="${x}" y="${y}" width="1" height="1" fill="${j%2?'#fff':'#ffd23f'}"/>`);
return `<svg class="av" style="--rc:${c};${z?`width:${z}px;height:${z}px`:''}" viewBox="0 0 10 10" shape-rendering="crispEdges" role="img" aria-label="شخصيتك"><g class="bob">${r}</g>${sp}</svg>`}
function seed(){return{users:{'المدير':{p:H('admin123'),xp:0,coins:0,sb:[],log:[],admin:1}},
quests:[
{id:1,t:'شارك في جلسة لعب جماعية',d:'انضم إلى جلسة لعب مع أعضاء الفيلق.',pr:'لقطة شاشة من الجلسة',xp:120,c:30,ty:'q'},
{id:2,t:'رشّح لعبة جديدة للفيلق',d:'اقترح لعبة مع سبب مناسب.',pr:'رابط الرسالة',xp:80,c:20,ty:'q'},
{id:3,t:'احضر 3 فعاليات هذا الأسبوع',d:'التزم بالحضور طوال الأسبوع.',pr:'أسماء الفعاليات',xp:200,c:50,ty:'w'},
{id:4,t:'ساعد عضوًا جديدًا',d:'أرشد عضوًا مبتدئًا خلال الأسبوع.',pr:'رابط المحادثة',xp:150,c:40,ty:'w'}],
secret:[
{id:1,t:'مهمة الظلّ: تحدَّ قائد الفيلق في لعبة واحدة',d:'اطلب من القائد مباراة ودية وأثبت ذلك.',pr:'لقطة شاشة النتيجة',price:60,xp:400,c:80,df:'صعبة'},
{id:2,t:'مهمة الظلّ: نظّم بطولة مصغّرة',d:'اجمع 4 أعضاء على الأقل في بطولة.',pr:'جدول البطولة',price:100,xp:700,c:120,df:'ملحمية'},
{id:3,t:'مهمة الظلّ: اصنع شعارًا لفريقك',d:'صمّم شعارًا وشاركه مع الفيلق.',pr:'صورة الشعار',price:40,xp:250,c:50,df:'متوسطة'}],
subs:[],nid:10}}
let db;try{db=JSON.parse(localStorage.getItem('rq4'))}catch(e){}if(!db)db=seed();
let me=null,tab='me',err='';try{me=sessionStorage.getItem('rqs')}catch(e){}
const save=()=>{try{localStorage.setItem('rq4',JSON.stringify(db))}catch(e){}};
const U=()=>db.users[me];
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function award(u,xp,c,r){const cap=Array.from({length:MAX-1},(_,i)=>need(i+1)).reduce((a,b)=>a+b,0);u.xp=Math.min(cap,u.xp+xp);u.coins=(u.coins||0)+c;u.log.unshift({t:Date.now(),r,c})}
function login(reg){const n=$v('n').trim(),p=$v('p');err='';
if(n.length<2||p.length<4){err='اللقب حرفان على الأقل وكلمة المرور 4 أحرف على الأقل.'}
else if(reg){if(db.users[n])err='هذا اللقب مستخدم، اختر لقبًا آخر.';else{db.users[n]={p:H(p),xp:0,coins:20,sb:[],log:[{t:Date.now(),r:'هدية الانضمام',c:20}]};save();enter(n)}}
else{if(!db.users[n]||db.users[n].p!==H(p))err='اللقب أو كلمة المرور غير صحيحة.';else enter(n)}
if(err)render()}
function enter(n){me=n;try{sessionStorage.setItem('rqs',n)}catch(e){}tab='me';render()}
function out(){me=null;aOK=false;try{sessionStorage.removeItem('rqs')}catch(e){}render()}
const $v=id=>document.getElementById(id).value;
function submit(qid,key){const t=$v('pf'+key).trim();if(!t)return toast('اكتب إثبات الإنجاز أولًا');
db.subs.push({id:db.nid++,u:me,q:qid,txt:t,st:'p',wk:wk(),at:Date.now()});save();toast('أُرسلت للمراجعة');render()}
function buy(id){const u=U(),s=db.secret.find(x=>x.id==id);if(u.coins<s.price)return toast('رصيدك لا يكفي');
u.coins-=s.price;u.sb.push(id);u.log.unshift({t:Date.now(),r:'شراء مهمة سرية',c:-s.price});save();toast('فُتحت المهمة السرية!');render()}
function review(id,ok){const s=db.subs.find(x=>x.id==id);s.st=ok?'ok':'no';
if(ok){const sec=String(s.q).startsWith('s'),q=sec?db.secret.find(x=>'s'+x.id==s.q):db.quests.find(x=>x.id==s.q);
if(q)award(db.users[s.u],q.xp,q.c,(sec?'مهمة سرية: ':'مهمة: ')+q.t)}save();render()}
function addQ(){const t=$v('qt').trim();if(!t)return toast('أدخل عنوان المهمة');
const o={id:db.nid++,t,d:$v('qd'),pr:$v('qp')||'إثبات نصي',xp:+$v('qx')||50,c:+$v('qc')||10};
if($v('qk')=='s'){o.price=+$v('qr')||50;o.df=$v('qf');db.secret.push(o)}else{o.ty=$v('qk');db.quests.push(o)}
save();toast('أُضيفت المهمة');render()}
function delQ(sec,id){const a=sec?db.secret:db.quests;a.splice(a.findIndex(x=>x.id==id),1);save();render()}
function delU(n){if(n==me)return;delete db.users[n];save();render()}
function setTab(t){tab=t;render()}
function status(qid,weekly){const s=db.subs.filter(x=>x.u==me&&x.q==qid&&(!weekly||x.wk==wk()));
return s.find(x=>x.st=='ok')?'ok':s.find(x=>x.st=='p')?'p':'n'}
function qcard(q,sec){const w=q.ty=='w',st=status(sec?'s'+q.id:q.id,w);const key=(sec?'s':'q')+q.id;
const done=st=='ok'&&!w;
return `<div class="q"><span class="tag ${sec?'s':w?'w':''}">${sec?'سرية':w?'أسبوعية':'مهمة'}</span><span class="tag p">فيلق الألعاب</span>
<h3>${E(q.t)}</h3><div class="mu">${E(q.d)}</div><div class="mu">الإثبات: ${E(q.pr)}</div>
<div class="px stat">+${q.xp} XP &nbsp; +${q.c} 🪙</div>
${st=='ok'?'<b style="color:var(--mn)">✔ مكتملة ومعتمدة</b>':st=='p'?'<b style="color:var(--gd)" class="blink">⏳ قيد المراجعة</b>':
`<textarea id="pf${key}" rows="2" placeholder="اكتب إثباتك هنا"></textarea><button class="btn g" onclick="submit(${sec?`'s${q.id}'`:q.id},'${key}')">أرسل الإنجاز</button>`}</div>`}
function secretView(){const u=U(),L=lv(u.xp).L;
const pool=db.secret;if(!pool.length)return'<div class="box">لا توجد مهام سرية بعد.</div>';
const s=pool[parseInt(H(me),36)%pool.length],bought=u.sb.includes(s.id);
return `<div class="box"><h2>🗝️ مهمتك السرية</h2><p class="mu">كل عضو يملك مهمة سرية مختلفة، تفاصيلها مخفية حتى تشتريها بالعملة.</p>
${bought?`<div class="grid">${qcard(s,1)}</div>`:`<div class="q"><h3>؟؟؟ مهمة مجهولة</h3><div class="mu">الصعوبة: ${E(s.df)}</div>
<div class="px stat">السعر ${s.price} 🪙 &nbsp; المكافأة +${s.xp} XP</div>
<button class="btn" ${u.coins<s.price?'disabled':''} onclick="buy(${s.id})">اشترِ المهمة</button>${u.coins<s.price?`<div class="mu">ينقصك ${s.price-u.coins} عملة</div>`:''}</div>`}</div>`}
function meView(){const u=U(),l=lv(u.xp),i=tIdx(l.L);
return `<div class="box"><div class="hero">${sprite(l.L)}<div style="flex:1;min-width:220px">
<h1 style="font-size:24px">${E(me)}</h1><div class="tag p" style="font-size:16px;color:#241f00">${TITLES[i]}</div>
<div class="px stat">LV ${l.L}/100 &nbsp; 🪙 ${u.coins||0}</div>
<div class="bar" role="progressbar" aria-valuenow="${l.cur}" aria-valuemax="${l.need}"><i style="width:${Math.round(l.cur/l.need*100)}%"></i></div>
<div class="mu px" style="font-size:10px;margin-top:6px">${l.cur} / ${l.need} XP</div></div></div></div>
<div class="box"><h2>📜 سجل المعاملات</h2><div class="tw"><table>${u.log.slice(0,12).map(x=>`<tr><td>${E(x.r)}</td><td class="px" style="font-size:11px;color:${x.c<0?'var(--pk)':'var(--mn)'}">${x.c>0?'+':''}${x.c}</td><td class="mu">${new Date(x.t).toLocaleDateString('ar-EG')}</td></tr>`).join('')||'<tr><td>لا توجد معاملات بعد. أنجز مهمة لتبدأ!</td></tr>'}</table></div></div>
<div class="box"><h2>🏅 الألقاب</h2><div class="tw"><table>${TITLES.map((t,k)=>`<tr style="${k==i?'background:var(--bg)':''}"><td style="color:${RC[k]}">${t}</td><td class="px" style="font-size:10px">${k*10+1}–${k*10+10}</td><td>${k<i?'✔':k==i?'◀ أنت هنا':'🔒'}</td></tr>`).join('')}</table></div></div>`}
function questsView(wkly){const a=db.quests.filter(q=>wkly?q.ty=='w':q.ty!='w');
const done=a.filter(q=>status(q.id,wkly)=='ok').length;
return `<div class="box"><h2>${wkly?'📅 المهام الأسبوعية':'⚔️ المهام'}</h2>${wkly?`<p class="mu">تتجدد كل أسبوع. أنجزت ${done} من ${a.length} (${a.length?Math.round(done/a.length*100):0}%)</p>`:''}
<div class="grid">${a.map(q=>qcard(q,0)).join('')||'<p>لا توجد مهام حاليًا.</p>'}</div></div>`}
function boardView(){const r=Object.entries(db.users).filter(([n,u])=>!u.admin).sort((a,b)=>b[1].xp-a[1].xp);
return `<div class="box"><h2>🏆 لوحة الأبطال</h2><div class="tw"><table>${r.map(([n,u],k)=>{const l=lv(u.xp).L;return `<tr><td class="px" style="font-size:11px">${k+1}</td><td>${E(n)}</td><td style="color:${RC[tIdx(l)]}">${TITLES[tIdx(l)]}</td><td class="px" style="font-size:11px">LV ${l}</td></tr>`}).join('')||'<tr><td>لا يوجد أعضاء بعد.</td></tr>'}</table></div></div>`}
let aOK=false;
const AC=()=>db.ac||H('riodan2026');
function unlock(){if(H($v('ac'))===AC()){aOK=true;toast('فُتحت الإدارة');render()}else toast('الرمز خاطئ')}
function setCode(){const c=$v('nc');if(c.length<6)return toast('الرمز 6 أحرف على الأقل');db.ac=H(c);save();toast('تم تغيير الرمز')}
function gateView(){return `<div class="box" style="max-width:440px;margin:4vh auto;text-align:center"><div style="font-size:48px">🔒</div><h2>بوابة الإدارة</h2><p class="mu">أدخل رمز الإدارة للدخول.</p><input id="ac" type="password" autocomplete="off" style="text-align:center"><button class="btn" onclick="unlock()">فتح</button></div>`}
function adminView(){if(!aOK)return gateView();const P=db.subs.filter(x=>x.st=='p');
const nm=id=>{const sec=String(id).startsWith('s'),q=sec?db.secret.find(x=>'s'+x.id==id):db.quests.find(x=>x.id==id);return q?q.t:'محذوفة'};
return `<div class="box"><h2>🔑 تغيير رمز الإدارة</h2><input id="nc" type="password" placeholder="الرمز الجديد"><button class="btn s" onclick="setCode()">حفظ الرمز</button></div><div class="box"><h2>📥 مراجعة الإثباتات (${P.length})</h2>${P.map(s=>`<div class="q" style="margin-bottom:10px"><b>${E(s.u)}</b> ← ${E(nm(s.q))}<div class="mu">${E(s.txt)}</div>
<button class="btn g" onclick="review(${s.id},1)">اعتماد</button><button class="btn r" onclick="review(${s.id},0)">رفض</button></div>`).join('')||'<p class="mu">لا توجد إثباتات معلّقة.</p>'}</div>
<div class="box"><h2>➕ إنشاء مهمة</h2><label>النوع</label><select id="qk"><option value="q">عادية</option><option value="w">أسبوعية</option><option value="s">سرية</option></select>
<label>العنوان</label><input id="qt"><label>الوصف</label><input id="qd"><label>طريقة الإثبات</label><input id="qp">
<div class="ph"><div><label>XP</label><input id="qx" type="number" value="100"></div><div><label>العملات</label><input id="qc" type="number" value="25"></div>
<div><label>السعر (للسرية)</label><input id="qr" type="number" value="50"></div><div><label>الصعوبة (للسرية)</label><select id="qf"><option>سهلة</option><option>متوسطة</option><option>صعبة</option><option>ملحمية</option></select></div></div>
<button class="btn" onclick="addQ()">حفظ المهمة</button></div>
<div class="box"><h2>🗂️ المهام الحالية</h2><div class="tw"><table>${[...db.quests.map(q=>[0,q]),...db.secret.map(q=>[1,q])].map(([s,q])=>`<tr><td>${s?'🗝️':q.ty=='w'?'📅':'⚔️'} ${E(q.t)}</td><td class="px" style="font-size:10px">${q.xp}XP/${q.c}🪙</td><td><button class="btn r" onclick="delQ(${s},${q.id})">حذف</button></td></tr>`).join('')}</table></div></div>
<div class="box"><h2>👥 الأعضاء</h2><div class="tw"><table>${Object.entries(db.users).map(([n,u])=>`<tr><td>${E(n)}${u.admin?' 👑':''}</td><td class="px" style="font-size:10px">LV ${lv(u.xp).L}</td><td class="px" style="font-size:10px">${u.coins||0}🪙</td><td>${n==me?'':`<button class="btn r" onclick="delU('${E(n).replace(/'/g,'')}')">حذف</button>`}</td></tr>`).join('')}</table></div></div>`}
function authView(){return `<div class="box" style="max-width:460px;margin:8vh auto"><div style="text-align:center">${sprite(1,96)}</div>
<h1 style="text-align:center">نظام التطوير</h1><p class="mu" style="text-align:center">مجلس الريودان · فيلق الألعاب</p>
<label>اللقب</label><input id="n" autocomplete="username"><label>كلمة المرور</label><input id="p" type="password" autocomplete="current-password">
${err?`<div style="color:var(--pk)">${err}</div>`:''}<button class="btn" onclick="login(0)">دخول</button><button class="btn s" onclick="login(1)">حساب جديد</button>
<p class="mu">حساب الإدارة التجريبي: «المدير» / admin123</p></div>`}
function render(){const a=document.getElementById('app');if(!me||!db.users[me]){a.innerHTML=authView();return}
const u=U(),T=[['me','👤 حسابي'],['q','⚔️ المهام'],['w','📅 الأسبوعية'],['s','🗝️ السرية'],['b','🏆 الأبطال']];if(u.admin)T.push(['a',(aOK?'🔓':'🔒')+' الإدارة']);
const V={me:meView,q:()=>questsView(0),w:()=>questsView(1),s:secretView,b:boardView,a:adminView};
a.innerHTML=`<div class="top"><h1>مملكة الريودان</h1><button class="btn r" onclick="out()">خروج</button></div>
<nav>${T.map(([k,l])=>`<button class="btn ${tab==k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('')}</nav>${V[tab]()}`}
['review','addQ','delQ','delU'].forEach(f=>{const o=window[f];window[f]=(...a)=>aOK?o(...a):toast('أدخل رمز الإدارة أولًا')});
(function(){const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated';document.body.prepend(cv);
const g=cv.getContext('2d'),PS=4,R=Math.random;let W,V;
const CL=['....###.....','..#######...','.###########','#############','.###########'],
AL=[['..#....#..','...#..#...','..######..','.##.##.##.','##########','#.######.#','#.#....#.#','...##.##..'],['..#....#..','#..#..#..#','#.######.#','###.##.###','##########','.########.','..#....#..','.#......#.']],
CN=[['.##.','####','####','.##.'],['.#.','###','###','.#.']],COL=['#ffd23f','#3ddc97','#ff4f8b','#4cc9f0','#ffffff'];
function rs(){W=Math.ceil(innerWidth/PS);V=Math.ceil(innerHeight/PS);cv.width=W;cv.height=V}
rs();addEventListener('resize',rs);
const cl=[...Array(5)].map(()=>({x:R()*300,y:R()*60+4,s:.1+R()*.15})),
al=[...Array(4)].map((_,i)=>({x:R()*300,y:20+R()*80,s:.12+R()*.1,p:R()*6,c:COL[i%4]})),
cn=[...Array(7)].map(()=>({x:R()*300,y:R()*200,s:.25+R()*.2})),
rn=[...Array(45)].map(()=>({x:R()*300,y:R()*200,s:.6+R()*.9,c:COL[R()*5|0]}));
const d=(sp,x,y,c,a)=>{g.globalAlpha=a;g.fillStyle=c;sp.forEach((row,j)=>{for(let i=0;i<row.length;i++)if(row[i]=='#')g.fillRect(Math.floor(x)+i,Math.floor(y)+j,1,1)})};
let t=0;
function draw(){g.clearRect(0,0,W,V);
rn.forEach(o=>{o.y+=o.s;if(o.y>V){o.y=-2;o.x=R()*W}g.globalAlpha=.5;g.fillStyle=o.c;g.fillRect(Math.floor(o.x),Math.floor(o.y),1,2)});
cl.forEach(o=>{o.x+=o.s;if(o.x>W+14)o.x=-14;d(CL,o.x,o.y,'#fff',.16)});
al.forEach(o=>{o.x+=o.s;if(o.x>W+12)o.x=-12;d(AL[(t/6|0)%2],o.x,o.y+Math.sin(t/15+o.p)*6,o.c,.4)});
cn.forEach(o=>{o.y+=o.s;if(o.y>V){o.y=-4;o.x=R()*W}d(CN[(t/8|0)%2],o.x,o.y,'#ffd23f',.6)});
t++}
draw();
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(draw,90)})();
render();
</script>
</body>
</html>
